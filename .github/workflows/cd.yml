name: Continuous delivery

on:
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release:
    name: Releasing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      # Validate the tag and its committed release note before any build.
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/release.mjs check "${GITHUB_REF_NAME}"
      - name: Check release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: node .github/scripts/release.mjs preflight
      - name: Set up GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Check the Pages domain
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node .github/scripts/release.mjs pages "${BASE_URL}"
      - name: Render the release note
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          title="$(node .github/scripts/release.mjs render "${GITHUB_REF_NAME}" --site-url "${SITE_URL}" --out "${notes}")"
          echo "RELEASE_TITLE=${title}" >> "${GITHUB_ENV}"
          echo "RELEASE_NOTES=--release-notes ${notes}" >> "${GITHUB_ENV}"

      # make tools dominates the build: share the tools cache with ci.yml vulns
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: tools/go.sum
          check-latest: true
      - name: Install tools for release checks
        run: make tools
      - name: Run fast check and tests
        run: make release-verify test TIMEOUT=2m
      - name: Publish the release
        uses: goreleaser/goreleaser-action@v7.2.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          distribution: goreleaser
          version: v2.18.2
          args: ${{ startsWith(github.ref, 'refs/tags/v') && format('release --clean {0}', env.RELEASE_NOTES) || 'release --snapshot --clean --skip=publish' }}

  notify:
    name: Notifying
    needs: [ release ]
    runs-on: ubuntu-24.04
    if: failure() || success()

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: 🚀
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
