name: Continuous delivery

on:
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release:
    name: Releasing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      # seconds-level safety net for bypassed local hooks, before any build
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/release.mjs check "${GITHUB_REF_NAME}"
      # a release comes only from a tag GitHub verifies; checked before anything
      # is published, a bad tag can still be replaced
      - name: Check the tag signature
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs signature "${GITHUB_REF_NAME}"
      - name: Check release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        id: preflight
        env:
          OCTOLAB_RELEASER_CLIENT_ID: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          OCTOLAB_RELEASER_KEY: ${{ secrets.OCTOLAB_RELEASER_KEY }}
        run: node .github/scripts/release.mjs preflight
      - name: Mint the tap token
        if: startsWith(github.ref, 'refs/tags/v')
        id: tap
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.OCTOLAB_RELEASER_KEY }}
          owner: ${{ steps.preflight.outputs.tap-owner }}
          repositories: ${{ steps.preflight.outputs.tap-name }}
          permission-contents: write
      - name: Set up GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Check the Pages domain
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node .github/scripts/release.mjs pages "${BASE_URL}"
      - name: Render the release note
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          title="$(node .github/scripts/release.mjs render "${GITHUB_REF_NAME}" --site-url "${SITE_URL}" --out "${notes}")"
          echo "RELEASE_TITLE=${title}" >> "${GITHUB_ENV}"
          echo "RELEASE_NOTES=--release-notes ${notes}" >> "${GITHUB_ENV}"

      - name: Set up Go environment
        id: go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          cache: false
          check-latest: true
      # warmup.caches.yml saves it on main: a cache saved from a tag is out of
      # reach of the next tag; a stale fallback still brings the modules
      - name: Restore the release build cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum', '.goreleaser.yml', '.github/workflows/warmup.caches.yml') }}
          restore-keys: |
            release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-
            release-${{ runner.os }}-
      # only the exact key proves the build cache warm: another go.sum or Go
      # version means a cold cross-compile of every target
      - name: Limit build parallelism on a cold cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "BUILD_FLAGS=--parallelism 2" >> "${GITHUB_ENV}"

      - name: Install tools for release checks
        run: make tools
      - name: Run fast check and tests
        run: make release-verify test
      - name: Publish the release
        uses: goreleaser/goreleaser-action@v7.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
        with:
          distribution: goreleaser
          version: v2.18.2
          # four cold cross-compiles in parallel are the peak of the run; a warm
          # cache needs a fraction of that — see BUILD_FLAGS
          args: ${{ startsWith(github.ref, 'refs/tags/v') && format('release --clean {0} {1}', env.BUILD_FLAGS, env.RELEASE_NOTES) || format('release --snapshot --clean --skip=publish {0}', env.BUILD_FLAGS) }}

  notify:
    name: Notifying
    needs: [ release ]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: 🚀
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
