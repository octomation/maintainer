name: Continuous delivery

on:
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release:
    name: Releasing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      # seconds-level safety net for bypassed local hooks, before any build
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/release.mjs check "${GITHUB_REF_NAME}"
      # a release, and the catalog's copy of the skill, come only from a tag
      # GitHub verifies; checked before anything is published, a bad tag can
      # still be replaced
      - name: Check the tag signature
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs signature "${GITHUB_REF_NAME}"
      - name: Check release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        id: preflight
        env:
          OCTOLAB_RELEASER_CLIENT_ID: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          OCTOLAB_RELEASER_KEY: ${{ secrets.OCTOLAB_RELEASER_KEY }}
        run: node .github/scripts/release.mjs preflight
      - name: Mint the tap token
        if: startsWith(github.ref, 'refs/tags/v')
        id: tap
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.OCTOLAB_RELEASER_KEY }}
          owner: ${{ steps.preflight.outputs.tap-owner }}
          repositories: ${{ steps.preflight.outputs.tap-name }}
          permission-contents: write
      - name: Set up GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check the Pages domain
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node .github/scripts/release.mjs pages "${BASE_URL}"
      - name: Render the release note
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          title="$(node .github/scripts/release.mjs render "${GITHUB_REF_NAME}" --site-url "${SITE_URL}" --out "${notes}")"
          echo "RELEASE_TITLE=${title}" >> "${GITHUB_ENV}"
          echo "RELEASE_NOTES=--release-notes ${notes}" >> "${GITHUB_ENV}"

      - name: Set up Go environment
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
          cache: false
          check-latest: true
      # warmup.caches.yml saves it on main: a cache saved from a tag is out of
      # reach of the next tag; a stale fallback still brings the modules
      - name: Restore the release build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum', '.goreleaser.yml', '.github/workflows/warmup.caches.yml') }}
          restore-keys: |
            release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-
            release-${{ runner.os }}-
      # only the exact key proves the build cache warm: another go.sum or Go
      # version means a cold cross-compile of every target
      - name: Limit build parallelism on a cold cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "BUILD_FLAGS=--parallelism 2" >> "${GITHUB_ENV}"

      - name: Install tools for release checks
        run: make tools
      - name: Check GoReleaser configuration policy
        run: node --test .github/scripts/goreleaser-check.test.mjs
      - name: Run the release checks and tests
        run: make release-verify test
      - name: Publish the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
        with:
          distribution: goreleaser
          version: v2.18.2
          # four cold cross-compiles in parallel are the peak of the run; a warm
          # cache needs a fraction of that — see BUILD_FLAGS
          args: ${{ startsWith(github.ref, 'refs/tags/v') && format('release --clean {0} {1}', env.BUILD_FLAGS, env.RELEASE_NOTES) || format('release --snapshot --clean --skip=publish {0}', env.BUILD_FLAGS) }}
      - name: Check the skill in the archives
        run: node .github/scripts/release.mjs skill

  # a job of its own: if publishing fails after the release is out, rerun
  # only this job; the catalog keeps stable releases only
  skill:
    name: Publishing the skill
    needs: [ release ]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the tap token is scoped to the tap, so the catalog gets its own
      - name: Mint the catalog token
        id: catalog
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.OCTOLAB_RELEASER_KEY }}
          owner: octolab
          repositories: skills
          permission-contents: write
      - name: Publish the agent skill
        id: skill
        uses: octomation/skills-action@v0.1.1
        with:
          tool: maintainer
          token: ${{ steps.catalog.outputs.token }}
      # the catalog holds exactly the skills of the release binary: read the
      # plugin back at the catalog tag and compare it with skill info
      - name: Download the release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            -p "maintainer_${GITHUB_REF_NAME#v}_linux-amd64.tar.gz" -O - | tar -xzf - -C "${RUNNER_TEMP}" maintainer
      - name: Compare the catalog with the release binary
        env:
          GH_TOKEN: ${{ steps.catalog.outputs.token }}
        run: node .github/scripts/release.mjs skill --catalog "maintainer--${GITHUB_REF_NAME}" --binary "${RUNNER_TEMP}/maintainer"

  # a job of its own: if publishing fails after the release is out, rerun
  # only this job; the catalog keeps stable releases only
  vanity:
    name: Publishing the module
    needs: [ release ]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # without the Releaser credentials (a project generated from a template,
      # a private repository on the Free plan) warn and end successfully
      - name: Check the Releaser credentials
        id: preflight
        env:
          OCTOLAB_RELEASER_CLIENT_ID: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          OCTOLAB_RELEASER_KEY: ${{ secrets.OCTOLAB_RELEASER_KEY }}
        run: |
          if [ -n "${OCTOLAB_RELEASER_CLIENT_ID}" ] && [ -n "${OCTOLAB_RELEASER_KEY}" ]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::warning title=Vanity::OCTOLAB_RELEASER_CLIENT_ID and OCTOLAB_RELEASER_KEY are not available to this repository; set them as organization or repository secrets to publish the module to go.octolab.org. Nothing was published.'
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
          fi
      - name: Checkout the repository
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Set up Go environment
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: 1.27.4, cache: false }
      - name: Mint the catalog token
        if: steps.preflight.outputs.ready == 'true'
        id: catalog
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.OCTOLAB_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.OCTOLAB_RELEASER_KEY }}
          owner: octolab
          repositories: vanity
          permission-contents: write
      - name: Publish the module to go.octolab.org
        if: steps.preflight.outputs.ready == 'true'
        uses: octomation/vanity-action@v0.1.0
        with:
          token: ${{ steps.catalog.outputs.token }}
          packages: all

  notify:
    name: Notifying
    needs: [ release, skill, vanity ]
    runs-on: ubuntu-24.04
    # success() is false when the skill job is skipped, on a prerelease or a
    # snapshot
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: 🚀
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
