name: Workflow caches warmup

on:
  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

  workflow_run:
    workflows: [ Workflow caches cleanup ]
    types: [ completed ]

  # a tag restores only caches of its own ref and of main, so the release
  # build cache has to be made on main, and GitHub evicts it after 7 idle days
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/warmup.caches.yml'
      - '.goreleaser.yml'
      - 'go.sum'
      - 'tools/go.sum'

  schedule:
    # twice a week: a run lags behind its cron, and 7 idle days evict a cache
    - cron: 0 7 * * 1,4 # at 07:00 on Monday and Thursday, UTC

permissions:
  contents: read

jobs:
  deps:
    name: Caching deps
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.x
          - 1.27.x

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Install dependencies
        run: make env deps

  docs:
    name: Caching docs deps
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
          check-latest: true
      - name: Install dependencies
        run: ./Taskfile docs npm ci

  tools:
    name: Caching tools
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: tools/go.sum
          check-latest: true

      - name: Install dependencies
        run: make env tools

  release:
    name: Caching release builds
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up Go environment
        id: go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x
          cache: false
          check-latest: true
      # the same key as the release job in cd.yml
      - name: Restore the release build cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum', '.goreleaser.yml', '.github/workflows/warmup.caches.yml') }}
          restore-keys: |
            release-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-
            release-${{ runner.os }}-
      # the same goreleaser as cd.yml: make tools installs into setup-go's
      # GOBIN, not bin/, and a different version could build differently
      - name: Build all release targets
        if: steps.cache.outputs.cache-hit != 'true'
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: build --snapshot --clean --parallelism 2
      # cd also builds the tools and the tests, with and without -race, for
      # the runner itself: the same commands keep those warm too
      - name: Build the release checks
        if: steps.cache.outputs.cache-hit != 'true'
        run: make tools source-check test
      - name: Save the release build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  notify:
    name: Notifying
    needs: [ deps, docs, release, tools ]
    runs-on: ubuntu-24.04
    # success() is false when the other jobs are skipped, on a push or a
    # schedule
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        with:
          emoji: ♻️
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}
