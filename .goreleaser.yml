version: 2

project_name: maintainer

archives:
  - id: maintainer
    files:
      - LICENSE
      - skills/maintainer/**
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# Publish the Formula next to the Cask; both install the same release.
# GoReleaser 2.18.2 still supports brews (deprecated).
brews:
  - name: maintainer
    ids: [maintainer]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is, #491
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: Maintainer is an indispensable assistant to Open Source contribution.
    directory: Formula
    homepage: https://github.com/octomation/maintainer
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Homebrew has no formula-to-cask conflicts: the caveat and the cask
    # preflight steps keep the two installations apart.
    caveats: |
      maintainer is published as a formula and as a cask; keep only one installation.
    install: |
      bin.install "maintainer"
      (bash_completion/"maintainer").write Utils.popen_read("#{bin}/maintainer", "completion", "bash")
      (zsh_completion/"_maintainer").write Utils.popen_read("#{bin}/maintainer", "completion", "zsh")
      (fish_completion/"maintainer.fish").write Utils.popen_read("#{bin}/maintainer", "completion", "fish")
      prefix.install_metafiles
    test: |
      system "#{bin}/maintainer", "version"

homebrew_casks:
  - name: maintainer
    ids: [maintainer]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is, #491
    skip_upload: auto
    binaries: [maintainer]
    commit_author:
      use_github_app_token: true
    description: Maintainer is an indispensable assistant to Open Source contribution.
    directory: Casks
    homepage: https://github.com/octomation/maintainer
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    generate_completions_from_executable:
      executable: maintainer
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]
    # Homebrew 7 deprecates the preflight hook that `hooks` renders. Clear the
    # quarantine before completions run the unsigned binary; warn when the
    # formula already owns the binary link.
    custom_block: |
      preflight_steps do
        if_path_exists "opt/maintainer", base: :homebrew_prefix do
          warn "maintainer is installed as a formula; run `brew uninstall --formula maintainer` first"
        end
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/maintainer"]
        end
      end

builds:
  - id: maintainer
    binary: maintainer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: .

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; the title from the release note,
  # see .github/scripts/release.mjs render
  name_template: '{{ envOrDefault "RELEASE_TITLE" .Tag }}'
  # a prerelease tag is published as a prerelease, never as Latest, #491
  prerelease: auto
  preflight:
    fail_on_error: true
