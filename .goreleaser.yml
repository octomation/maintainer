version: 2

project_name: maintainer

archives:
  - id: maintainer
    files:
      - LICENSE
      - skills/maintainer/**
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but it is the only GoReleaser generator of a
# Formula, and only a Formula has the service block that brew services runs:
# one package for the CLI and the service, #456. Keep GoReleaser pinned in CI.
brews:
  - name: maintainer
    ids: [maintainer]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is, #491
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: Maintainer is an indispensable assistant to Open Source contribution.
    license: MIT
    directory: Formula
    homepage: https://github.com/octomation/maintainer
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "maintainer"
      generate_completions_from_executable(bin/"maintainer", "completion")
      prefix.install_metafiles
    service: |
      run macos: [opt_bin/"maintainer", "service", "run"]
      keep_alive true
      working_dir Dir.home
      log_path var/"log/maintainer.log"
      error_log_path var/"log/maintainer.log"
    caveats: |
      Start the local service as your normal user:
        brew services start octolab/tap/maintainer
      Then open http://maintainer.localhost:17841/
    test: |
      system "#{bin}/maintainer", "version"
      system "#{bin}/maintainer", "service", "run", "--help"

builds:
  - id: maintainer
    binary: maintainer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: .

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; the title from the release note,
  # see .github/scripts/release.mjs render
  name_template: '{{ envOrDefault "RELEASE_TITLE" .Tag }}'
  # a prerelease tag is published as a prerelease, never as Latest, #491
  prerelease: auto
  preflight:
    fail_on_error: true
